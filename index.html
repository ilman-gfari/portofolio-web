<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portofolio data professional.">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/5996/5996469.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{document.documentElement.dataset.mode=localStorage.getItem("mode")||"light"}catch(e){document.documentElement.dataset.mode="mode"}</script>
  <script src="page-transition.js"></script>
</head>
<body>
  <div class="progress" id="progress"></div>

  <header class="nav" id="nav">
    <a class="logo" href="#top" id="logo"></a>
    <nav id="navLinks"></nav>
    <button class="theme-btn" id="themeBtn" aria-label="Ganti tema">◐</button>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero" id="top">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="wrap">
      <span class="status" id="status"><i></i><b></b></span>
      <h1 id="heroName"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="chips" id="skills"></div>
      <div class="cta" id="cta"></div>
    </div>
  </section>

  <!-- ===== MARQUEE ===== -->
  <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

  <!-- ===== WORK ===== -->
  <section class="section" id="work">
    <div class="wrap">
      <h2 data-reveal id="workHeading"></h2>
      <p class="sub" data-reveal id="workSub"></p>
      <div class="cards" id="cards"></div>
      <p class="more" data-reveal id="workMore"></p>
    </div>
  </section>

  <!-- ===== APPROACH ===== -->
  <section class="section alt" id="approach">
    <div class="wrap">
      <h2 data-reveal id="apHeading"></h2>
      <p class="sub" data-reveal id="apTag"></p>
      <div class="steps" id="steps"></div>
      <div class="bring" data-reveal>
        <h3 id="bringTitle"></h3>
        <ul id="bringList"></ul>
      </div>
    </div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section class="section" id="contact">
    <div class="wrap center">
      <h2 data-reveal id="ctHeading"></h2>
      <p class="sub" data-reveal id="ctText"></p>
      <div class="cta" data-reveal id="ctButtons"></div>
    </div>
  </section>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
